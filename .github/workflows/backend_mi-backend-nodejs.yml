name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches:
      - backend   # Cambiado a la rama donde tienes tu backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      # Si no tienes script build en package.json, elimina este paso o déjalo comentado
      #- name: Build
      #  working-directory: ./backend
      #  run: npm run build

      - name: Ensure start file
        working-directory: ./backend
        run: |
          if [ ! -f server.js ] && [ -f app.js ]; then
            cp app.js server.js
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'mi-backend-nodejs'
          slot-name: 'production'
          package: ./backend
