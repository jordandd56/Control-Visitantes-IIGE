name: Test Node.js backend

on:
  push:
    branches:
      - backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver contenido del repo
        run: |
          pwd
          ls -la
          ls -la backend

      - uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Instalar y probar
        working-directory: ./backend
        run: |
          npm install
          npm run test --if-present
