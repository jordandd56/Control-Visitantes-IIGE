name: Deploy Node.js Backend to Azure

on:
  push:
    branches:
      - backend
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend   # 👈 TODOS los comandos se ejecutan dentro de /backend
    steps:
      - uses: actions/checkout@v4

      - name: Verificar estructura
        run: |
          echo "📂 Root:"
          ls -la
          echo "📂 Backend:"
          ls -la backend

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Instalar dependencias
        run: npm install

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F990CE9B02494968B66514F1FFD3164C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_208E9B721387456F8979AEF2F3A00804 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_404CDE25A1AA484C809BF4AC3FA1091F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mi-backend-nodejs'
          slot-name: 'Production'
          package: ./backend   # 👈 Sube la carpeta backend completa
